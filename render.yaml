# Render Blueprint — deploys the Dubai Lagoon dashboard.
# In Render: New + → Blueprint → connect this repo. Then set the three env
# vars (SUPABASE_URL, SUPABASE_KEY, LAGOON_SITES) in the dashboard, and add the
# custom domain lagoons.gdm-enviro.com.
services:
  - type: web
    name: lagoon-dashboard
    runtime: python
    plan: free                      # upgrade to 'starter' ($7/mo) to keep it always-on
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: SUPABASE_URL
        sync: false                 # set the value in the Render dashboard
      - key: SUPABASE_KEY
        sync: false
      - key: LAGOON_SITES
        value: "Emaar,Damac,Nakheel"
      - key: PYTHON_VERSION
        value: "3.12.7"
