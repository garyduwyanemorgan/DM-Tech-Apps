# Render Blueprint — deploys the Dubai Lagoon dashboard.
# In Render: New + → Blueprint → connect this repo. Then set the three env
# vars (SUPABASE_URL, SUPABASE_KEY, LAGOON_SITES) in the dashboard, and add the
# custom domain lagoons.gdm-enviro.com.
services:
  # ── Unified Application: React Frontend + FastAPI Backend ──
  - type: web
    name: lagoon-app
    runtime: python
    plan: free                      # upgrade to 'starter' ($7/mo) to keep it always-on
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LAGOON_SITES
        value: "Emaar,Damac,Nakheel"
      - key: API_KEY                # auth: callers must send X-API-Key header (optional)
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

