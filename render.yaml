# Render Blueprint — deploys the Compliance Intelligence Platform.
# In Render: New + → Blueprint → connect this repo. Then fill in every
# `sync: false` value in the dashboard, and add the custom domain
# lagoons.gdm-enviro.com.
#
# There is no secrets.toml and no .env on Render — every secret arrives as an
# environment variable declared below. A name that is missing here can never be
# set, and the feature that needs it reports itself unconfigured at runtime.
# Names follow SECTION_KEY from core/config.py; see .env.example.
services:
  # ── Unified Application: React Frontend + FastAPI Backend ──
  - type: web
    name: lagoon-app
    runtime: python
    plan: free                      # upgrade to 'starter' ($7/mo) to keep it always-on
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LAGOON_SITES
        value: "Emaar,Damac,Nakheel"
      - key: API_KEY                # auth: callers must send X-API-Key header (optional)
        sync: false
      # Clerk. Values live in the Render dashboard, NOT here: a live publishable
      # key is only accepted by Clerk on its registered domain, so hardcoding one
      # would break any service deployed on a different origin (e.g. *.onrender.com).
      # VITE_CLERK_PUBLISHABLE_KEY is read by Vite during buildCommand — it MUST be
      # present at build time or the SPA boots with an empty ClerkProvider.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY   # backend fallback (no secrets.toml on Render)
        sync: false
      - key: CLERK_SECRET_KEY        # SECRET — set in the Render dashboard, never here
        sync: false
      # AI lab-report extraction (extract.py). Without this the upload endpoint
      # returns 503 "AI extraction needs an Anthropic API key".
      - key: ANTHROPIC_API_KEY
        sync: false
      # Payments. PAYMENT_PROVIDER selects which block below is used; the
      # matching *_SECRET_KEY must be set or /api checkout routes return 503.
      - key: PAYMENT_PROVIDER
        value: "checkout"
      - key: CHECKOUT_SECRET_KEY
        sync: false
      - key: CHECKOUT_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_BILLING_COUNTRY
        value: "AE"
      # Access-request notifications. ADMIN_NOTIFY_EMAIL also gates which address
      # may bootstrap itself as super_admin. Without SMTP_HOST, requests are
      # logged to stderr instead of emailed.
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

